<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Three.js Player – Same Folder Load</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87CEEB; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      color: white; background: rgba(0,0,0,0.5);
      padding: 10px; border-radius: 6px; font-family: sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <b>WASD</b> = laufen<br>
  <b>Maus</b> = schauen<br><br>
  <button id="start">Start</button>
</div>

<script type="module">
  import * as THREE from "https://esm.run/three@0.160.0";
  import { PointerLockControls } from "https://esm.run/three@0.160.0/examples/jsm/controls/PointerLockControls.js";
  import { GLTFLoader } from "https://esm.run/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

  let camera, scene, renderer, controls;
  let player;
  let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
  let velocity = new THREE.Vector3();
  let prevTime = performance.now();

  // Szene
  scene = new THREE.Scene();

  // Kamera
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 3, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Licht
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 3);
  sun.position.set(100, 200, 100);
  scene.add(sun);

  // Boden
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshLambertMaterial({ color: 0x33cc33 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Pointer Lock Controls
  controls = new PointerLockControls(camera, document.body);
  document.getElementById("start").onclick = () => controls.lock();

  controls.addEventListener("lock", () => {
    document.getElementById("ui").style.display = "none";
  });
  controls.addEventListener("unlock", () => {
    document.getElementById("ui").style.display = "block";
  });

  // GLB Loader – AUTOMATISCH aus dem gleichen Ordner
  const loader = new GLTFLoader();
  loader.load("./player.glb", (gltf) => {
    player = gltf.scene;
    player.position.set(0, 0, 0);
    player.scale.set(1, 1, 1);
    scene.add(player);
  });

  // Tastatur
  document.addEventListener("keydown", (e) => {
    if (e.code === "KeyW") moveForward = true;
    if (e.code === "KeyS") moveBackward = true;
    if (e.code === "KeyA") moveLeft = true;
    if (e.code === "KeyD") moveRight = true;
  });

  document.addEventListener("keyup", (e) => {
    if (e.code === "KeyW") moveForward = false;
    if (e.code === "KeyS") moveBackward = false;
    if (e.code === "KeyA") moveLeft = false;
    if (e.code === "KeyD") moveRight = false;
  });

  // Animation
  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;

    if (controls.isLocked) {
      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;

      const speed = 40;

      if (moveForward) velocity.z -= speed * delta;
      if (moveBackward) velocity.z += speed * delta;
      if (moveLeft) velocity.x -= speed * delta;
      if (moveRight) velocity.x += speed * delta;

      controls.moveRight(velocity.x * delta);
      controls.moveForward(velocity.z * delta);

      controls.getObject().position.y = 3;

      // Player folgt der Kamera
      if (player) {
        player.position.copy(controls.getObject().position);
      }
    }

    prevTime = time;
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
