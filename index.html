<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>3D Fläche – Drei.js Walk</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute; top: 10px; left: 10px;
      color: #fff; font-family: sans-serif; z-index: 10;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 4px;
    }
    button {
      margin-top: 6px; padding: 4px 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="info">
    <div>WASD = laufen, Maus = schauen</div>
    <button id="start">Klick zum Start (Pointer Lock)</button>
  </div>

  <!-- Drei.js von CDN (für GitHub Pages einfach so benutzen) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    let camera, scene, renderer, controls;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();

    init();
    animate();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Szene & Kamera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202030);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // Licht
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(50, 100, -50);
      scene.add(dirLight);

      // Boden (3D Fläche)
      const planeGeo = new THREE.PlaneGeometry(500, 500);
      const planeMat = new THREE.MeshStandardMaterial({ color: 0x228822 });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      plane.rotation.x = -Math.PI / 2;
      plane.receiveShadow = true;
      scene.add(plane);

      // Ein paar Boxen als Orientierung
      const boxGeo = new THREE.BoxGeometry(5, 5, 5);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x8888ff });
      for (let i = 0; i < 20; i++) {
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(
          (Math.random() - 0.5) * 200,
          2.5,
          (Math.random() - 0.5) * 200
        );
        scene.add(box);
      }

      // PointerLockControls (First-Person)
      controls = new THREE.PointerLockControls(camera, document.body);
      camera.position.set(0, 2, 0); // Augenhöhe

      const startBtn = document.getElementById('start');
      startBtn.addEventListener('click', () => {
        controls.lock();
      });

      controls.addEventListener('lock', () => {
        startBtn.style.display = 'none';
      });
      controls.addEventListener('unlock', () => {
        startBtn.style.display = 'block';
      });

      // Tastatur
      const onKeyDown = (event) => {
        switch (event.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
        }
      };

      const onKeyUp = (event) => {
        switch (event.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      };

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      if (controls.isLocked === true) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        const speed = 50.0;

        if (moveForward) velocity.z -= speed * delta;
        if (moveBackward) velocity.z += speed * delta;
        if (moveLeft) velocity.x -= speed * delta;
        if (moveRight) velocity.x += speed * delta;

        controls.moveRight(velocity.x * delta);
        controls.moveForward(velocity.z * delta);

        // Auf Bodenhöhe halten
        const pos = controls.getObject().position;
        pos.y = 2;
      }

      prevTime = time;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
