<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>3D Walk – Sichtbare Version</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      color: white; background: rgba(0,0,0,0.5);
      padding: 10px; border-radius: 6px; font-family: sans-serif;
    }
  </style>
</head>
<body>

<div id="ui">
  <b>WASD</b> = laufen<br>
  <b>Maus</b> = schauen<br><br>
  <button id="start">Start</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>

<script>
  let camera, scene, renderer, controls;
  let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
  let velocity = new THREE.Vector3();
  let prevTime = performance.now();

  // Szene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x444444); // heller Hintergrund

  // Kamera
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 3, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Licht – sehr stark
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 2.0);
  dir.position.set(50, 100, -50);
  scene.add(dir);

  // Boden – Lambert = immer sichtbar
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshLambertMaterial({ color: 0x22aa22 })
  );
  plane.rotation.x = -Math.PI / 2;
  scene.add(plane);

  // Pointer Lock
  controls = new THREE.PointerLockControls(camera, document.body);
  document.getElementById("start").onclick = () => controls.lock();

  controls.addEventListener("lock", () => {
    document.getElementById("ui").style.display = "none";
  });
  controls.addEventListener("unlock", () => {
    document.getElementById("ui").style.display = "block";
  });

  // Tastatur
  document.addEventListener("keydown", (e) => {
    if (e.code === "KeyW") moveForward = true;
    if (e.code === "KeyS") moveBackward = true;
    if (e.code === "KeyA") moveLeft = true;
    if (e.code === "KeyD") moveRight = true;
  });

  document.addEventListener("keyup", (e) => {
    if (e.code === "KeyW") moveForward = false;
    if (e.code === "KeyS") moveBackward = false;
    if (e.code === "KeyA") moveLeft = false;
    if (e.code === "KeyD") moveRight = false;
  });

  // Animation
  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;

    if (controls.isLocked) {
      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;

      const speed = 40;

      if (moveForward) velocity.z -= speed * delta;
      if (moveBackward) velocity.z += speed * delta;
      if (moveLeft) velocity.x -= speed * delta;
      if (moveRight) velocity.x += speed * delta;

      controls.moveRight(velocity.x * delta);
      controls.moveForward(velocity.z * delta);

      controls.getObject().position.y = 3;
    }

    prevTime = time;
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
